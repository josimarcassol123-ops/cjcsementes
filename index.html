<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>J CASSOL SEMENTES - Organização de Tarefas</title>
  <style>
    :root {
      --verde-vibrante: #4CAF50;
      --verde-escuro: #388E3C;
      --verde-claro: #C8E6C9;
      --laranja-brasa: #D4781A;
      --laranja-brasa-escuro: #A85F12;
      --branco: #FFFFFF;
      --fundo: #F5F5F5;
      --texto: #1B1B1B;
      --texto-secundario: #666666;
      --borda: #E0E0E0;
      --sombra: 0 4px 12px rgba(0,0,0,0.12);
      --sombra-forte: 0 8px 24px rgba(0,0,0,0.18);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--fundo);
      color: var(--texto);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(135deg, var(--verde-vibrante) 0%, var(--verde-escuro) 100%);
      padding: 14px 16px;
      padding-top: calc(14px + var(--safe-top));
      padding-left: calc(16px + var(--safe-left));
      padding-right: calc(16px + var(--safe-right));
      box-shadow: var(--sombra-forte);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--branco);
      border-radius: 14px;
      padding: 8px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      min-width: 140px;
      min-height: 52px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .logo-icon { width: 34px; height: 34px; flex-shrink: 0; }

    .logo-text-block {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .logo-main {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .logo-main .cjc { color: var(--verde-vibrante); }
    .logo-main .sementes { color: var(--laranja-brasa); }

    .logo-tagline {
      font-size: 8px;
      color: var(--texto-secundario);
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-top: 2px;
    }

    .title {
      text-align: center;
      color: var(--laranja-brasa);
      font-weight: 800;
      text-transform: uppercase;
      font-size: clamp(16px, 2.8vw, 28px);
      text-shadow: 0 1px 2px rgba(0,0,0,0.18);
      letter-spacing: 0.5px;
    }

    .stats {
      display: flex;
      gap: 14px;
      color: var(--branco);
      font-size: 13px;
      font-weight: 600;
      justify-content: flex-end;
    }

    .stat { display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
    .stat-value { font-size: 20px; font-weight: 800; }
    .stat-label { font-size: 10px; opacity: 0.95; text-transform: uppercase; }

    /* Controls */
    .controls {
      max-width: 1200px;
      margin: 16px auto 8px;
      padding: 0 16px;
      padding-left: calc(16px + var(--safe-left));
      padding-right: calc(16px + var(--safe-right));
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .controls select,
    .controls input {
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--borda);
      background: var(--branco);
      font-size: 14px;
      color: var(--texto);
      min-width: 140px;
      flex: 1 1 140px;
    }

    .controls select:focus,
    .controls input:focus {
      outline: 2px solid var(--verde-vibrante);
      outline-offset: 2px;
    }

    .btn-clear {
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: var(--laranja-brasa);
      color: var(--branco);
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      min-width: 120px;
    }

    .btn-clear:hover { background: var(--laranja-brasa-escuro); }
    .btn-clear:active { transform: scale(0.97); }

    /* Board */
    .board-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 16px 100px;
      padding-left: calc(16px + var(--safe-left));
      padding-right: calc(16px + var(--safe-right));
      padding-bottom: calc(100px + var(--safe-bottom));
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: start;
    }

    .column {
      background: var(--branco);
      border-radius: 16px;
      box-shadow: var(--sombra);
      display: flex;
      flex-direction: column;
      min-height: 220px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .column-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--fundo);
    }

    .column-title {
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .column.afazer .column-title { color: var(--laranja-brasa); }
    .column.fazendo .column-title { color: var(--verde-vibrante); }
    .column.concluido .column-title { color: var(--verde-escuro); }

    .column-count {
      background: var(--fundo);
      color: var(--texto-secundario);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      min-width: 28px;
      text-align: center;
    }

    .column-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 160px;
    }

    .column-body.drag-over { background: var(--verde-claro); }

    .task-card {
      background: var(--branco);
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 12px;
      cursor: grab;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      position: relative;
    }

    .task-card:hover { border-color: var(--verde-vibrante); box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
    .task-card:active { cursor: grabbing; transform: scale(1.01); }
    .task-card.dragging { opacity: 0.6; transform: rotate(2deg); }

    .task-card.tap-active { border-color: var(--verde-vibrante); box-shadow: 0 0 0 3px var(--verde-claro); }

    .task-priority-bar {
      height: 4px;
      border-radius: 2px;
      margin-bottom: 8px;
    }
    .priority-alta { background: #E53935; }
    .priority-media { background: var(--laranja-brasa); }
    .priority-baixa { background: var(--verde-vibrante); }

    .task-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
      line-height: 1.3;
      color: var(--texto);
    }

    .task-desc {
      font-size: 13px;
      color: var(--texto-secundario);
      margin-bottom: 10px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }

    .task-member {
      background: var(--verde-claro);
      color: var(--verde-escuro);
      padding: 4px 8px;
      border-radius: 10px;
      min-height: 26px;
      display: inline-flex;
      align-items: center;
    }

    .task-deadline {
      color: var(--texto-secundario);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 26px;
    }

    .task-deadline.overdue { color: #E53935; font-weight: 700; }

    .task-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-edit { background: var(--verde-claro); color: var(--verde-escuro); }
    .btn-edit:hover { background: var(--verde-vibrante); color: var(--branco); }
    .btn-delete { background: #FFEBEE; color: #C62828; }
    .btn-delete:hover { background: #EF9A9A; color: var(--branco); }
    .btn-icon:active { transform: scale(0.92); }

    .empty-state {
      padding: 24px 12px;
      text-align: center;
      color: var(--texto-secundario);
      font-size: 13px;
      font-weight: 600;
    }
    .empty-state-icon { font-size: 28px; margin-bottom: 8px; display: block; }

    /* FAB */
    .fab {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      right: calc(20px + var(--safe-right));
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--verde-vibrante);
      color: var(--branco);
      border: none;
      box-shadow: var(--sombra-forte);
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.15s;
      z-index: 200;
      min-height: 60px;
      min-width: 60px;
    }

    .fab:hover { background: var(--verde-escuro); }
    .fab:active { transform: scale(0.92); }

    /* Modal / Bottom Sheet */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 0;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: var(--branco);
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      border-radius: 20px 20px 0 0;
      padding: 20px 18px 24px;
      padding-bottom: calc(24px + var(--safe-bottom));
      transform: translateY(100%);
      transition: transform 0.25s ease;
      overflow-y: auto;
      box-shadow: var(--sombra-forte);
    }

    .modal-overlay.open .modal-sheet { transform: translateY(0); }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--verde-escuro);
      text-transform: uppercase;
    }

    .modal-close {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--fundo);
      color: var(--texto);
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .modal-close:hover { background: var(--borda); }

    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--texto-secundario);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .form-input,
    .form-select,
    .form-textarea {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--borda);
      font-size: 15px;
      font-family: inherit;
      color: var(--texto);
      background: var(--branco);
    }

    .form-textarea { min-height: 80px; resize: vertical; }
    .form-input:focus,
    .form-select:focus,
    .form-textarea:focus {
      outline: 2px solid var(--verde-vibrante);
      outline-offset: 2px;
      border-color: var(--verde-vibrante);
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      min-height: 50px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary { background: var(--verde-vibrante); color: var(--branco); }
    .btn-primary:hover { background: var(--verde-escuro); }
    .btn-danger { background: #E53935; color: var(--branco); }
    .btn-danger:hover { background: #B71C1C; }
    .btn-secondary { background: var(--fundo); color: var(--texto); }
    .btn-secondary:hover { background: var(--borda); }
    .btn:active { transform: scale(0.98); }

    /* Toasts */
    .toast-container {
      position: fixed;
      top: calc(12px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: calc(100% - 32px);
      max-width: 360px;
      pointer-events: none;
    }

    .toast {
      background: var(--texto);
      color: var(--branco);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--sombra-forte);
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.25s, transform 0.25s;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: var(--verde-escuro); }
    .toast.error { background: #C62828; }

    /* Responsive */
    @media (max-width: 860px) {
      .header-content { grid-template-columns: auto 1fr; gap: 12px; }
      .title { grid-column: 1 / -1; order: 3; justify-self: center; width: 100%; text-align: center; }
      .stats { justify-content: flex-end; }
      .board { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding-bottom: 8px; }
      .column { width: 80vw; flex: 0 0 80vw; scroll-snap-align: center; min-height: 60vh; }
      .board::-webkit-scrollbar { display: none; }
      .board { -ms-overflow-style: none; scrollbar-width: none; }
    }

    @media (max-width: 540px) {
      .header-content { grid-template-columns: 1fr; gap: 10px; }
      .logo-wrapper { justify-self: center; }
      .stats { justify-content: center; }
      .title { font-size: 18px; }
      .controls { margin-top: 12px; }
      .fab { width: 56px; height: 56px; }
    }

    @media (min-width: 861px) {
      .modal-overlay { align-items: center; padding: 20px; }
      .modal-sheet { border-radius: 20px; transform: translateY(20px) scale(0.96); }
      .modal-overlay.open .modal-sheet { transform: translateY(0) scale(1); }
    }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</head>
<body>
  <header class="header" role="banner">
    <div class="header-content">
      <div class="logo-wrapper" aria-label="J CASSOL SEMENTES">
        <a href="#" class="logo" onclick="return false;">
          <svg class="logo-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M24 44C24 44 12 32 12 20C12 12 18 6 24 6C30 6 36 12 36 20C36 32 24 44 24 44Z" fill="#C8E6C9"/>
            <path d="M24 40C24 40 18 28 18 22C18 16 20 12 24 12" stroke="#388E3C" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M24 36C24 36 30 28 30 20C30 14 28 10 24 10" stroke="#388E3C" stroke-width="2.5" stroke-linecap="round"/>
            <ellipse cx="16" cy="22" rx="7" ry="10" transform="rotate(-35 16 22)" fill="#4CAF50"/>
            <ellipse cx="32" cy="22" rx="7" ry="10" transform="rotate(35 32 22)" fill="#D4781A"/>
            <path d="M24 40V28" stroke="#388E3C" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <span class="logo-text-block">
            <span class="logo-main"><span class="cjc">CJC</span> <span class="sementes">SEMENTES</span></span>
            <span class="logo-tagline">A tecnologia que seu solo precisa</span>
          </span>
        </a>
      </div>
      <h1 class="title">ORGANIZAÇÃO DE TAREFAS</h1>
      <div class="stats" aria-live="polite">
        <div class="stat">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">Total</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-pending">0</span>
          <span class="stat-label">Pendentes</span>
        </div>
      </div>
    </div>
  </header>

  <section class="controls" aria-label="Filtros">
    <select id="filter-member" aria-label="Filtrar por membro">
      <option value="">Todos os membros</option>
      <option value="JO">JOSIMAR (JO)</option>
      <option value="CI">CIDIMAR (CI)</option>
      <option value="MÁ">MÁRCIA (MÁ)</option>
    </select>
    <select id="filter-priority" aria-label="Filtrar por prioridade">
      <option value="">Todas as prioridades</option>
      <option value="Alta">Alta</option>
      <option value="Média">Média</option>
      <option value="Baixa">Baixa</option>
    </select>
    <button class="btn-clear" id="btn-clear-filters" type="button">Limpar Filtros</button>
  </section>

  <main class="board-wrapper" aria-label="Quadro Kanban">
    <div class="board" id="board">
      <section class="column afazer" data-status="afazer" aria-label="Coluna A Fazer">
        <div class="column-header">
          <span class="column-title">A Fazer</span>
          <span class="column-count" id="count-afazer">0</span>
        </div>
        <div class="column-body" id="col-afazer"></div>
      </section>
      <section class="column fazendo" data-status="fazendo" aria-label="Coluna Fazendo">
        <div class="column-header">
          <span class="column-title">Fazendo</span>
          <span class="column-count" id="count-fazendo">0</span>
        </div>
        <div class="column-body" id="col-fazendo"></div>
      </section>
      <section class="column concluido" data-status="concluido" aria-label="Coluna Concluído">
        <div class="column-header">
          <span class="column-title">Concluído</span>
          <span class="column-count" id="count-concluido">0</span>
        </div>
        <div class="column-body" id="col-concluido"></div>
      </section>
    </div>
  </main>

  <button class="fab" id="fab-add" aria-label="Adicionar tarefa">+</button>

  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-sheet" role="document">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Nova Tarefa</h2>
        <button class="modal-close" id="btn-close-modal" aria-label="Fechar">&times;</button>
      </div>
      <form id="task-form">
        <input type="hidden" id="task-id">
        <div class="form-group">
          <label class="form-label" for="task-title">Título</label>
          <input type="text" class="form-input" id="task-title" placeholder="Ex: Revisar pedido de sementes" required maxlength="120">
        </div>
        <div class="form-group">
          <label class="form-label" for="task-desc">Descrição</label>
          <textarea class="form-textarea" id="task-desc" placeholder="Detalhes da tarefa..." maxlength="500"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="task-member">Responsável</label>
          <select class="form-select" id="task-member" required>
            <option value="">Selecione</option>
            <option value="JO">JOSIMAR (JO)</option>
            <option value="CI">CIDIMAR (CI)</option>
            <option value="MÁ">MÁRCIA (MÁ)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="task-deadline">Prazo</label>
          <input type="date" class="form-input" id="task-deadline" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="task-priority">Prioridade</label>
          <select class="form-select" id="task-priority" required>
            <option value="Baixa">Baixa</option>
            <option value="Média" selected>Média</option>
            <option value="Alta">Alta</option>
          </select>
        </div>
        <div class="form-group" id="form-status-group" style="display:none;">
          <label class="form-label" for="task-status">Status</label>
          <select class="form-select" id="task-status">
            <option value="afazer">A Fazer</option>
            <option value="fazendo">Fazendo</option>
            <option value="concluido">Concluído</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-danger" id="btn-delete-task" style="display:none;">Excluir</button>
          <button type="button" class="btn btn-secondary" id="btn-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script>
    (function() {
      'use strict';

      const STORAGE_KEY = 'jcassol_kanban_tasks_v1';
      const COLUMNS = ['afazer', 'fazendo', 'concluido'];
      const MEMBERS = { JO: 'JOSIMAR (JO)', CI: 'CIDIMAR (CI)', 'MÁ': 'MÁRCIA (MÁ)' };
      const PRIORITIES = { Alta: 'priority-alta', Média: 'priority-media', Baixa: 'priority-baixa' };
      const EMPTY_ICONS = ['🌱', '🌿', '🌾'];

      let tasks = [];
      let currentEditId = null;
      let isDesktop = window.matchMedia('(min-width: 861px)').matches;

      const board = document.getElementById('board');
      const modalOverlay = document.getElementById('modal-overlay');
      const taskForm = document.getElementById('task-form');
      const fabAdd = document.getElementById('fab-add');
      const btnCloseModal = document.getElementById('btn-close-modal');
      const btnCancel = document.getElementById('btn-cancel');
      const btnDeleteTask = document.getElementById('btn-delete-task');
      const formStatusGroup = document.getElementById('form-status-group');
      const filterMember = document.getElementById('filter-member');
      const filterPriority = document.getElementById('filter-priority');
      const btnClearFilters = document.getElementById('btn-clear-filters');

      function generateId() {
        return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
      }

      function loadTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            tasks = JSON.parse(saved);
          } else {
            seedDemoTasks();
          }
        } catch (e) {
          tasks = [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (e) {
          showToast('Erro ao salvar tarefas', 'error');
        }
      }

      function seedDemoTasks() {
        const today = new Date().toISOString().split('T')[0];
        const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
        tasks = [
          { id: generateId(), title: 'Separar pedido de milho', description: 'Conferir quantidade e variedade para o cliente.', member: 'JO', deadline: today, priority: 'Alta', status: 'afazer', createdAt: new Date().toISOString() },
          { id: generateId(), title: 'Atualizar planilha de estoque', description: 'Lançar entradas e saídas de sementes da semana.', member: 'MÁ', deadline: tomorrow, priority: 'Média', status: 'fazendo', createdAt: new Date().toISOString() },
          { id: generateId(), title: 'Contatar transportadora', description: 'Agendar coleta para entrega na fazenda.', member: 'CI', deadline: today, priority: 'Baixa', status: 'concluido', createdAt: new Date().toISOString() }
        ];
        saveTasks();
      }

      function getFilteredTasks() {
        const m = filterMember.value;
        const p = filterPriority.value;
        return tasks.filter(t => (!m || t.member === m) && (!p || t.priority === p));
      }

      function render() {
        const filtered = getFilteredTasks();
        COLUMNS.forEach((status, idx) => {
          const col = document.getElementById('col-' + status);
          col.innerHTML = '';
          const colTasks = filtered.filter(t => t.status === status).sort((a, b) => {
            const prioOrder = { Alta: 3, Média: 2, Baixa: 1 };
            if (prioOrder[b.priority] !== prioOrder[a.priority]) return prioOrder[b.priority] - prioOrder[a.priority];
            return new Date(a.deadline) - new Date(b.deadline);
          });

          document.getElementById('count-' + status).textContent = colTasks.length;

          if (colTasks.length === 0) {
            col.innerHTML = `<div class="empty-state"><span class="empty-state-icon">${EMPTY_ICONS[idx]}</span>Nenhuma tarefa nesta coluna</div>`;
          } else {
            colTasks.forEach(task => {
              col.appendChild(createTaskCard(task));
            });
          }
        });

        document.getElementById('stat-total').textContent = filtered.length;
        document.getElementById('stat-pending').textContent = filtered.filter(t => t.status !== 'concluido').length;
      }

      function createTaskCard(task) {
        const card = document.createElement('div');
        card.className = 'task-card';
        card.draggable = true;
        card.dataset.id = task.id;

        const overdue = task.status !== 'concluido' && new Date(task.deadline) < new Date(new Date().setHours(0,0,0,0));

        card.innerHTML = `
          <div class="task-priority-bar ${PRIORITIES[task.priority] || 'priority-baixa'}"></div>
          <div class="task-title">${escapeHtml(task.title)}</div>
          <div class="task-desc">${escapeHtml(task.description || '')}</div>
          <div class="task-meta">
            <span class="task-member">${escapeHtml(MEMBERS[task.member] || task.member)}</span>
            <span class="task-deadline ${overdue ? 'overdue' : ''}">📅 ${formatDate(task.deadline)}</span>
            <span class="task-deadline">${priorityIcon(task.priority)} ${task.priority}</span>
          </div>
          <div class="task-actions">
            <button class="btn-icon btn-edit" type="button" aria-label="Editar tarefa">✎</button>
            <button class="btn-icon btn-delete" type="button" aria-label="Excluir tarefa">🗑</button>
          </div>
        `;

        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragend', handleDragEnd);
        card.addEventListener('click', e => {
          if (e.target.closest('.btn-icon')) return;
          card.classList.add('tap-active');
          setTimeout(() => card.classList.remove('tap-active'), 150);
          openEditModal(task.id);
        });
        card.querySelector('.btn-edit').addEventListener('click', e => { e.stopPropagation(); openEditModal(task.id); });
        card.querySelector('.btn-delete').addEventListener('click', e => { e.stopPropagation(); deleteTask(task.id); });
        return card;
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function formatDate(dateStr) {
        if (!dateStr) return '';
        const [y, m, d] = dateStr.split('-');
        return `${d}/${m}/${y}`;
      }

      function priorityIcon(priority) {
        if (priority === 'Alta') return '🔴';
        if (priority === 'Média') return '🟠';
        return '🟢';
      }

      // Drag and drop
      let draggedId = null;
      function handleDragStart(e) {
        if (!isDesktop) { e.preventDefault(); return; }
        draggedId = this.dataset.id;
        this.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedId);
      }
      function handleDragEnd(e) {
        this.classList.remove('dragging');
        draggedId = null;
        document.querySelectorAll('.column-body').forEach(c => c.classList.remove('drag-over'));
      }

      document.querySelectorAll('.column-body').forEach(body => {
        body.addEventListener('dragover', e => {
          if (!isDesktop) return;
          e.preventDefault();
          body.classList.add('drag-over');
          e.dataTransfer.dropEffect = 'move';
        });
        body.addEventListener('dragleave', e => {
          body.classList.remove('drag-over');
        });
        body.addEventListener('drop', e => {
          if (!isDesktop) return;
          e.preventDefault();
          body.classList.remove('drag-over');
          const id = e.dataTransfer.getData('text/plain') || draggedId;
          const newStatus = body.parentElement.dataset.status;
          if (id && newStatus) moveTask(id, newStatus);
        });
      });

      function moveTask(id, newStatus) {
        const task = tasks.find(t => t.id === id);
        if (!task || task.status === newStatus) return;
        task.status = newStatus;
        saveTasks();
        render();
        showToast('Tarefa movida com sucesso!', 'success');
      }

      // Swipe navigation on mobile
      let touchStartX = 0;
      let touchStartY = 0;
      board.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });
      board.addEventListener('touchend', e => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const dx = touchEndX - touchStartX;
        const dy = touchEndY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
          const columns = Array.from(document.querySelectorAll('.column'));
          if (!columns.length) return;
          const boardRect = board.getBoundingClientRect();
          const centerX = boardRect.left + boardRect.width / 2;
          let currentIndex = 0;
          let minDist = Infinity;
          columns.forEach((col, i) => {
            const rect = col.getBoundingClientRect();
            const colCenter = rect.left + rect.width / 2;
            const dist = Math.abs(colCenter - centerX);
            if (dist < minDist) { minDist = dist; currentIndex = i; }
          });
          let targetIndex = currentIndex;
          if (dx < 0 && currentIndex < columns.length - 1) targetIndex = currentIndex + 1;
          if (dx > 0 && currentIndex > 0) targetIndex = currentIndex - 1;
          if (targetIndex !== currentIndex) {
            columns[targetIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
          }
        }
      }, { passive: true });

      // Modal
      function openModal(isEdit = false) {
        modalOverlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        formStatusGroup.style.display = isEdit ? 'block' : 'none';
        btnDeleteTask.style.display = isEdit ? 'inline-flex' : 'none';
        document.getElementById('modal-title').textContent = isEdit ? 'Editar Tarefa' : 'Nova Tarefa';
      }

      function closeModal() {
        modalOverlay.classList.remove('open');
        document.body.style.overflow = '';
        taskForm.reset();
        currentEditId = null;
      }

      function openAddModal() {
        currentEditId = null;
        document.getElementById('task-id').value = '';
        document.getElementById('task-deadline').value = new Date().toISOString().split('T')[0];
        openModal(false);
      }

      function openEditModal(id) {
        const task = tasks.find(t => t.id === id);
        if (!task) return;
        currentEditId = id;
        document.getElementById('task-id').value = id;
        document.getElementById('task-title').value = task.title;
        document.getElementById('task-desc').value = task.description || '';
        document.getElementById('task-member').value = task.member;
        document.getElementById('task-deadline').value = task.deadline;
        document.getElementById('task-priority').value = task.priority;
        document.getElementById('task-status').value = task.status;
        openModal(true);
      }

      taskForm.addEventListener('submit', e => {
        e.preventDefault();
        const title = document.getElementById('task-title').value.trim();
        const description = document.getElementById('task-desc').value.trim();
        const member = document.getElementById('task-member').value;
        const deadline = document.getElementById('task-deadline').value;
        const priority = document.getElementById('task-priority').value;
        if (!title || !member || !deadline || !priority) return;

        if (currentEditId) {
          const task = tasks.find(t => t.id === currentEditId);
          if (task) {
            task.title = title;
            task.description = description;
            task.member = member;
            task.deadline = deadline;
            task.priority = priority;
            task.status = document.getElementById('task-status').value;
          }
          showToast('Tarefa atualizada!', 'success');
        } else {
          tasks.push({
            id: generateId(),
            title,
            description,
            member,
            deadline,
            priority,
            status: 'afazer',
            createdAt: new Date().toISOString()
          });
          showToast('Tarefa adicionada!', 'success');
        }
        saveTasks();
        render();
        closeModal();
      });

      function deleteTask(id) {
        if (!confirm('Tem certeza que deseja excluir esta tarefa?')) return;
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        render();
        closeModal();
        showToast('Tarefa excluída!', 'success');
      }

      btnDeleteTask.addEventListener('click', () => {
        if (currentEditId) deleteTask(currentEditId);
      });

      fabAdd.addEventListener('click', openAddModal);
      btnCloseModal.addEventListener('click', closeModal);
      btnCancel.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', e => {
        if (e.target === modalOverlay) closeModal();
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
      });

      // Filters
      filterMember.addEventListener('change', render);
      filterPriority.addEventListener('change', render);
      btnClearFilters.addEventListener('click', () => {
        filterMember.value = '';
        filterPriority.value = '';
        render();
      });

      // Toast
      function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast ' + type;
        toast.textContent = message;
        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add('show'));
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 250);
        }, 2500);
      }

      // Media query for desktop detection
      const mq = window.matchMedia('(min-width: 861px)');
      mq.addEventListener('change', e => { isDesktop = e.matches; });

      // Init
      loadTasks();
      render();
    })();
  </script>
</body>
</html>
